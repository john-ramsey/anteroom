# Publish `anteroom` to npm via TRUSTED PUBLISHING (OIDC) — no token, no secret.
# npm authenticates this workflow through GitHub's OIDC id-token and ties the published tarball to
# THIS repo's exact commit + run (provenance is automatic), so anyone can verify the code that runs
# on their machine. Requires `id-token: write` + npm CLI >= 11.5.1 + Node >= 22.14.0.
#
# One-time setup on npmjs.com/package/anteroom/access: add a GitHub Actions trusted publisher
# (repository john-ramsey/anteroom, workflow file publish.yml). OIDC can't do a package's FIRST
# publish, so the name is created once with a 0.0.0 placeholder; every real release publishes here.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # NO registry-url: it writes an .npmrc _authToken line that shadows OIDC — npm then
        # skips the trusted-publishing exchange, tries the empty token, and (with 2FA on the
        # account) hangs waiting for an OTP. npm defaults to the public registry anyway.
        with:
          node-version: 24 # >= 22.14.0, required by trusted publishing
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm install
      - run: npm run build
        env:
          # Public-by-design value (no secret): baked into the bundle at build time.
          ANTEROOM_GITHUB_CLIENT_ID: ${{ vars.ANTEROOM_GITHUB_CLIENT_ID }}
      - run: npm publish --access public # OIDC auth via id-token; provenance is automatic
